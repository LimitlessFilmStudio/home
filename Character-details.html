<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nathan Lee | 不止不息Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Oswald:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #f0ece4;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    .hero {
      min-height: 50vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 120px 24px 60px;
      background: radial-gradient(ellipse at 50% 60%, #1a0808 0%, #0d0505 40%, #0a0a0a 100%);
      position: relative;
    }
    .hero::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(192,57,43,0.3), transparent);
    }
    .hero-avatar {
      width: 160px; height: 160px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Noto Serif SC', serif;
      font-size: 56px; font-weight: 700; color: #fff;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #2c0a0a, #4a1515);
      border: 2px solid rgba(192,57,43,0.3);
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .hero-avatar:hover {
      transform: scale(1.2);
      box-shadow: 0 8px 30px rgba(192,57,43,0.3);
    }
    .hero h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: clamp(36px, 6vw, 56px);
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }
    .hero .title {
      font-size: 13px; font-weight: 500;
      letter-spacing: 3px; text-transform: uppercase;
      color: #c0392b;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    .section-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 18px; font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #2a2a2a;
    }

    .bio {
      font-size: 15px;
      color: #999;
      line-height: 1.8;
      margin-bottom: 48px;
    }
    .bio p { margin-bottom: 8px; }

    .film-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 48px;
    }
    .film-card {
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.2s;
    }
    .film-card:hover { transform: translateY(-2px); }
    .film-card img {
      width: 100%; aspect-ratio: 2/3;
      object-fit: cover; display: block;
    }
    .film-card .info { padding: 12px; }
    .film-card .info .name {
      font-size: 14px; font-weight: 600; margin-bottom: 2px;
    }
    .film-card .info .meta {
      font-size: 12px; color: #666;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #999;
      font-size: 13px;
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: #222;
      color: #f0ece4;
      border-color: #c0392b;
    }

    @media (max-width: 768px) {
      .hero { min-height: 40vh; padding: 100px 16px 40px; }
      .film-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .film-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-avatar" style="background:url(https://p0.pipi.cn/mediaplus/mobile_ios_pro/e42958b7fcfe323d6915d579ed74d2717d93d.jpg?imageView2/1/w/128/h/170) center/cover no-repeat;font-size:0;border-color:rgba(192,57,43,0.5);">NL</div>
    <h1>Nathan Lee</h1>
    <p class="title">创始人 &amp; 剪辑指导</p>
  </section>
  <div class="container">
    <h2 class="section-title">个人简介</h2>
    <div class="bio">
      <p>四川泸州人</p>
      <p>秉持"剪辑是故事灵魂"的理念，精通犯罪、动作、剧情等题材，以画面承载情感，用剪辑塑造力量。</p>
    </div>

    <h2 class="section-title">电影作品</h2>
    <div class="film-grid">
      <div class="film-card">
        <img src="https://p0.pipi.cn/mediaplus/friday_image_fe/0fa3349a5bef8772a914dc012abccd4e419e4.jpg?imageMogr2/thumbnail/2500x2500%3E" alt="731">
        <div class="info"><div class="name">731</div><div class="meta">赵林山 · 19.43亿</div></div>
      </div>
      <div class="film-card">
        <img src="https://p0.pipi.cn/mediaplus/friday_image_fe/cdf05c9a15d5c2fa463e790a6281d8cd3cb54.jpg?imageMogr2/thumbnail/2500x2500%3E" alt="危机航线">
        <div class="info"><div class="name">危机航线</div><div class="meta">彭顺 · 3亿</div></div>
      </div>
      <div class="film-card">
        <img src="https://p0.pipi.cn/mediaplus/friday_image_fe/cdf05cbf0516e36e38f87b726706cf7bc01ea.jpg?imageMogr2/thumbnail/2500x2500%3E" alt="重生">
        <div class="info"><div class="name">重生</div><div class="meta">马浴柯 · 4.64亿</div></div>
      </div>
      <div class="film-card">
        <img src="https://p0.pipi.cn/friday/4bb2bb42b0dc728b32796d61e035fd83.jpg?imageMogr2/thumbnail/2500x2500%3E" alt="怒潮">
        <div class="info"><div class="name">怒潮</div><div class="meta">马浴柯 · 2.29亿</div></div>
      </div>
      <div class="film-card">
        <img src="https://p0.pipi.cn/basicdata/54ecdedddddb12d23c230fd57df76f2d15095.jpg?imageMogr2/thumbnail/2500x2500%3E" alt="关于我妈的一切">
        <div class="info"><div class="name">关于我妈的一切</div><div class="meta">赵天宇 · 1.5亿</div></div>
      </div>
      <div class="film-card">
        <img src="https://p0.pipi.cn/basicdata/54ecdedd71f0faf2aa230f42484ddc1344c98.jpg?imageMogr2/thumbnail/2500x2500%3E" alt="如影随心">
        <div class="info"><div class="name">如影随心</div><div class="meta">霍建起 · 2367.8万</div></div>
      </div>
      <div class="film-card">
        <img src="https://p0.pipi.cn/basicdata/54ecde33b538070e1311e597a0ec728aa6a0a.jpg?imageMogr2/thumbnail/2500x2500%3E" alt="父子雄兵">
        <div class="info"><div class="name">父子雄兵</div><div class="meta">袁卫东 · 1.25亿</div></div>
      </div>
    </div>

    <h2 class="section-title">电视剧作品</h2>
    <div class="film-grid" style="grid-template-columns: repeat(2, 1fr);">
      <div class="film-card">
        <div class="info"><div class="name">围猎</div><div class="meta">电视剧</div></div>
      </div>
      <div class="film-card">
        <div class="info"><div class="name">猎罪图鉴1</div><div class="meta">电视剧</div></div>
      </div>
      <div class="film-card">
        <div class="info"><div class="name">民初奇人传</div><div class="meta">电视剧</div></div>
      </div>
      <div class="film-card">
        <div class="info"><div class="name">林海雪原</div><div class="meta">电视剧</div></div>
      </div>
    </div>

    <div style="text-align: center; margin-top: 48px;">
      <a href="index.html" class="back-btn">&larr; 返回首页</a>
    </div>
  </div>
</body>
</html>
